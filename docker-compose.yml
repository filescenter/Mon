# Local development: Odoo 19 Community + PostgreSQL.
# The repository itself is mounted as the addons folder, so editing a file
# here (or pulling from GitHub) changes what Odoo runs.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: unless-stopped

  odoo:
    image: odoo:19.0
    depends_on:
      - db
    ports:
      - "8069:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    volumes:
      - odoo-data:/var/lib/odoo
      - ./:/mnt/extra-addons
    # xml: views and templates are re-read from the files on each request.
    # reload: Odoo restarts by itself when a Python file changes.
    command: ["odoo", "--dev=xml,reload"]
    restart: unless-stopped

volumes:
  db-data:
  odoo-data:

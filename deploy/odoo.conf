[options]
addons_path = /mnt/extra-addons
data_dir = /var/lib/odoo

; One database only, and no database manager on the internet.
db_name = siddiqa
dbfilter = ^siddiqa$
list_db = False
; Replace with a long random value before the first start.
admin_passwd = CHANGE-ME

; Odoo sits behind Caddy, which terminates HTTPS.
proxy_mode = True

; Two workers suit a 2 vCPU / 4 GB server. Raise with the server size.
workers = 2
max_cron_threads = 1
limit_time_cpu = 120
limit_time_real = 240
